services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: tender_scout
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d tender_scout" ]
      interval: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/tender_scout
    ports: ["8000:8000"]
    volumes: [./app:/srv/app]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata: